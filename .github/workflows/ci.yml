name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No secrets are provided to CI. The build must succeed without them
  # (environment validation is lazy; see src/lib/env).
  NEXT_TELEMETRY_DISABLED: "1"
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Forbid service-role key and Auth Admin API in application code
        # docs/SECURITY.md §4: only the isolated privileged runner may use them.
        run: |
          if grep -rnE "SERVICE_ROLE|service_role|serviceRole|SUPABASE_SECRET|SECRET_KEY|sb_secret_|auth\.admin|admin\.(createUser|deleteUser|updateUserById|inviteUserByEmail|generateLink)" src/; then
            echo "Service-role / Auth Admin usage is not allowed under src/" >&2
            exit 1
          fi

      - name: AI architecture guards (decision RPCs, vendor SDKs, test provider)
        run: scripts/ci/ai-guards.sh

      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  database:
    name: Database (local Supabase, pgTAP, Auth integration, end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile only; includes pinned Supabase CLI)
        run: npm ci

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Database tests (pgTAP; explicit path; fail on zero or too few tests)
        env:
          MIN_PGTAP_TESTS: "201"
        run: |
          set -euo pipefail
          npx supabase test db supabase/tests 2>&1 | tee pgtap.log
          tests="$(grep -oE 'Tests=[0-9]+' pgtap.log | tail -1 | cut -d= -f2 || true)"
          echo "pgTAP tests executed: ${tests:-0}"
          if [ -z "${tests:-}" ] || [ "${tests}" -lt "${MIN_PGTAP_TESTS}" ]; then
            echo "::error::expected at least ${MIN_PGTAP_TESTS} pgTAP tests, executed ${tests:-0}"
            exit 1
          fi
          grep -q '^Result: PASS' pgtap.log

      - name: Auth and RLS integration tests (fail on zero or too few tests)
        env:
          MIN_INTEGRATION_TESTS: "22"
        run: |
          set -euo pipefail
          npx supabase status -o env > supabase/.temp/status.env
          npx vitest run --config vitest.integration.config.ts \
            --reporter=default --reporter=json --outputFile.json=integration-results.json
          node -e '
            const r = require("./integration-results.json");
            const min = Number(process.env.MIN_INTEGRATION_TESTS);
            console.log(`integration tests: total=${r.numTotalTests} passed=${r.numPassedTests} failed=${r.numFailedTests}`);
            if (r.numTotalTests < min || r.numFailedTests !== 0 || r.numPassedTests !== r.numTotalTests) {
              console.error(`::error::expected at least ${min} passing integration tests`);
              process.exit(1);
            }'

      - name: Build the app for end-to-end tests
        run: npm run build

      - name: Install Playwright Chromium (version pinned by package-lock)
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests (fail on zero or too few tests)
        env:
          MIN_E2E_TESTS: "20"
        run: |
          set -euo pipefail
          npx supabase status -o env > supabase/.temp/status.env
          npx playwright test
          node -e '
            const r = require("./test-results/e2e.json");
            const s = r.stats;
            const min = Number(process.env.MIN_E2E_TESTS);
            console.log(`e2e tests: passed=${s.expected} failed=${s.unexpected} flaky=${s.flaky} skipped=${s.skipped}`);
            if (s.expected < min || s.unexpected !== 0 || s.flaky !== 0 || s.skipped !== 0) {
              console.error(`::error::expected at least ${min} passing end-to-end tests`);
              process.exit(1);
            }'

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan Git history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
