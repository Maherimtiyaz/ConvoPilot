<!doctype html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #111827; line-height: 1.5;">
    <h2 style="margin: 0 0 16px;">Sign in to ConvoPilot</h2>
    <p>Use the button below to sign in.</p>
    <p>
      <a href="{{ .SiteURL }}/auth/confirm#th={{ .TokenHash }}"
         style="display: inline-block; padding: 10px 18px; background: #111827; color: #ffffff; border-radius: 6px; text-decoration: none;">
        Sign in
      </a>
    </p>
    <p style="color: #6b7280; font-size: 13px;">This link works once and expires in 30 minutes. If you did not request it, you can ignore this email.</p>
  </body>
</html>
